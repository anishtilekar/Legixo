name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 3.11 is pinned deliberately: pinecone and langchain-together cap support
      # at 3.13, and 3.14 hits wheel build failures.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint
        run: ruff check app scripts tests

      # No secrets are configured for this workflow on purpose. The suite stubs
      # the retriever and both chat models, so it must pass with no API keys and
      # no network — if a test ever needs a key, that test is wrong.
      - name: Tests (offline, no API keys)
        run: pytest tests/ -q

      - name: Chunking works without any configuration
        run: python -m scripts.ingest --dry-run

      - name: Fail if a real API key was committed
        run: |
          if grep -rInE 'tgp_v1_[A-Za-z0-9]{20,}|pcsk_[A-Za-z0-9_]{30,}|ls__[A-Za-z0-9]{20,}' \
              --exclude-dir=.git . ; then
            echo "::error::a live-looking API key is present in the repository"
            exit 1
          fi
          echo "no key-shaped strings found"
